<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0D060"/>
      <stop offset="50%" stop-color="#C6A664"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C6A664" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>
  <rect width="400" height="560" fill="url(#glow)"/>

  <!-- Art Deco geometric patterns -->
  <!-- Top fan -->
  <g opacity="0.15" stroke="#C6A664" stroke-width="0.6" fill="none">
    <path d="M200 10 L200 80"/>
    <path d="M200 10 Q230 50 260 80"/>
    <path d="M200 10 Q170 50 140 80"/>
    <path d="M200 10 Q255 40 290 75"/>
    <path d="M200 10 Q145 40 110 75"/>
    <line x1="100" y1="80" x2="300" y2="80"/>
  </g>

  <!-- Outer border double -->
  <rect x="16" y="16" width="368" height="528" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
  <rect x="22" y="22" width="356" height="516" fill="none" stroke="#C6A664" stroke-width="0.4" opacity="0.2"/>

  <!-- Diamond corner ornaments -->
  <g fill="#C6A664" opacity="0.6">
    <polygon points="16,16 28,22 22,28 10,22" />
    <polygon points="384,16 372,22 378,28 390,22" />
    <polygon points="16,544 28,538 22,532 10,538" />
    <polygon points="384,544 372,538 378,532 390,538" />
  </g>

  <!-- Side geometric accents -->
  <g stroke="#C6A664" stroke-width="0.5" fill="none" opacity="0.25">
    <line x1="16" y1="200" x2="40" y2="200"/>
    <line x1="28" y1="188" x2="28" y2="212"/>
    <line x1="384" y1="200" x2="360" y2="200"/>
    <line x1="372" y1="188" x2="372" y2="212"/>
    <line x1="16" y1="360" x2="40" y2="360"/>
    <line x1="28" y1="348" x2="28" y2="372"/>
    <line x1="384" y1="360" x2="360" y2="360"/>
    <line x1="372" y1="348" x2="372" y2="372"/>
  </g>

  <!-- Gold ornament top center -->
  <g transform="translate(200,80)" opacity="0.85">
    <polygon points="0,-22 6,-6 22,-6 10,4 14,20 0,10 -14,20 -10,4 -22,-6 -6,-6" fill="url(#gold)" opacity="0.7"/>
  </g>

  <!-- Top divider bar -->
  <line x1="60" y1="116" x2="340" y2="116" stroke="url(#gold)" stroke-width="0.7" opacity="0.5"/>
  <line x1="60" y1="120" x2="340" y2="120" stroke="#C6A664" stroke-width="0.3" opacity="0.2"/>

  <!-- Invitation text -->
  <text x="200" y="148" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#C6A664" opacity="0.6" letter-spacing="4">VOUS ÊTES INVITÉS</text>

  <!-- Names in gold -->
  <text x="200" y="207" text-anchor="middle" font-family="Georgia,serif" font-size="33" fill="url(#gold)" font-weight="300" font-style="italic" opacity="0.9">Sonia</text>
  <text x="200" y="233" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#C6A664" opacity="0.4" letter-spacing="6">&amp;</text>
  <text x="200" y="272" text-anchor="middle" font-family="Georgia,serif" font-size="33" fill="url(#gold)" font-weight="300" font-style="italic" opacity="0.9">Selim</text>

  <!-- Gold divider -->
  <line x1="80" y1="295" x2="160" y2="295" stroke="url(#gold)" stroke-width="0.8" opacity="0.4"/>
  <polygon points="200,291 204,295 200,299 196,295" fill="#C6A664" opacity="0.6"/>
  <line x1="240" y1="295" x2="320" y2="295" stroke="url(#gold)" stroke-width="0.8" opacity="0.4"/>

  <!-- Date -->
  <text x="200" y="325" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" fill="#C6A664" opacity="0.65" letter-spacing="1.5">Vendredi 3 Octobre 2025</text>
  <text x="200" y="348" text-anchor="middle" font-family="Georgia,serif" font-size="8.5" fill="#C6A664" opacity="0.4">Grand Hotel, Carthage</text>

  <!-- Art deco band -->
  <rect x="40" y="375" width="320" height="1" fill="url(#gold)" opacity="0.2"/>
  <rect x="60" y="378" width="280" height="0.5" fill="#C6A664" opacity="0.1"/>

  <!-- Countdown dark boxes -->
  <g transform="translate(200,425)" opacity="0.8">
    <rect x="-110" y="-20" width="48" height="40" rx="3" fill="#C6A664" opacity="0.12"/>
    <rect x="-55" y="-20" width="48" height="40" rx="3" fill="#C6A664" opacity="0.12"/>
    <rect x="7" y="-20" width="48" height="40" rx="3" fill="#C6A664" opacity="0.12"/>
    <rect x="62" y="-20" width="48" height="40" rx="3" fill="#C6A664" opacity="0.12"/>
    <rect x="-110" y="-20" width="48" height="40" rx="3" fill="none" stroke="#C6A664" stroke-width="0.5" opacity="0.3"/>
    <rect x="-55" y="-20" width="48" height="40" rx="3" fill="none" stroke="#C6A664" stroke-width="0.5" opacity="0.3"/>
    <rect x="7" y="-20" width="48" height="40" rx="3" fill="none" stroke="#C6A664" stroke-width="0.5" opacity="0.3"/>
    <rect x="62" y="-20" width="48" height="40" rx="3" fill="none" stroke="#C6A664" stroke-width="0.5" opacity="0.3"/>
    <text x="-86" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#C6A664" opacity="0.9">55</text>
    <text x="-31" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#C6A664" opacity="0.9">22</text>
    <text x="31" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#C6A664" opacity="0.9">08</text>
    <text x="86" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#C6A664" opacity="0.9">41</text>
    <text x="-86" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#C6A664" opacity="0.4">JOURS</text>
    <text x="-31" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#C6A664" opacity="0.4">HEURES</text>
    <text x="31" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#C6A664" opacity="0.4">MIN</text>
    <text x="86" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#C6A664" opacity="0.4">SEC</text>
  </g>

  <!-- RSVP gold button -->
  <rect x="120" y="478" width="160" height="34" rx="2" fill="url(#gold)" opacity="0.9"/>
  <rect x="122" y="480" width="156" height="30" rx="1" fill="none" stroke="#0D1117" stroke-width="0.5" opacity="0.3"/>
  <text x="200" y="500" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#0D1117" letter-spacing="3">CONFIRMER</text>

  <!-- Stars scattered -->
  <g fill="#C6A664" opacity="0.2">
    <circle cx="50" cy="200" r="1.5"/>
    <circle cx="350" cy="180" r="1"/>
    <circle cx="70" cy="340" r="1"/>
    <circle cx="340" cy="320" r="1.5"/>
    <circle cx="60" cy="450" r="1"/>
    <circle cx="355" cy="440" r="1"/>
  </g>

  <text x="200" y="545" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#C6A664" opacity="0.25" letter-spacing="3">DAAWA · GRIFFON D'OR</text>
</svg>