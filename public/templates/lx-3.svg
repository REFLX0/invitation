<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF8E8"/>
      <stop offset="50%" stop-color="#FBF2D0"/>
      <stop offset="100%" stop-color="#F5E8B0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C840"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8960A"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#F0C840" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>
  <rect width="400" height="560" fill="url(#sunGlow)"/>

  <!-- Carthaginian column pillars left/right -->
  <g opacity="0.25" fill="#9A7A10">
    <!-- Left pillar -->
    <rect x="28" y="70" width="20" height="400" rx="2"/>
    <rect x="24" y="65" width="28" height="12" rx="1"/>
    <rect x="24" y="466" width="28" height="12" rx="1"/>
    <rect x="22" y="60" width="32" height="6" rx="1"/>
    <rect x="22" y="474" width="32" height="6" rx="1"/>
    <!-- Column fluting lines -->
    <line x1="33" y1="78" x2="33" y2="466" stroke="#F0C840" stroke-width="0.5" opacity="0.5"/>
    <line x1="38" y1="78" x2="38" y2="466" stroke="#F0C840" stroke-width="0.5" opacity="0.5"/>
    <line x1="43" y1="78" x2="43" y2="466" stroke="#F0C840" stroke-width="0.5" opacity="0.5"/>
    <!-- Right pillar -->
    <rect x="352" y="70" width="20" height="400" rx="2"/>
    <rect x="348" y="65" width="28" height="12" rx="1"/>
    <rect x="348" y="466" width="28" height="12" rx="1"/>
    <rect x="346" y="60" width="32" height="6" rx="1"/>
    <rect x="346" y="474" width="32" height="6" rx="1"/>
    <line x1="357" y1="78" x2="357" y2="466" stroke="#F0C840" stroke-width="0.5" opacity="0.5"/>
    <line x1="362" y1="78" x2="362" y2="466" stroke="#F0C840" stroke-width="0.5" opacity="0.5"/>
    <line x1="367" y1="78" x2="367" y2="466" stroke="#F0C840" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Classical frieze top -->
  <rect x="55" y="55" width="290" height="20" fill="#D4AF37" opacity="0.25"/>
  <rect x="55" y="55" width="290" height="1.5" fill="#D4AF37" opacity="0.6"/>
  <rect x="55" y="74" width="290" height="1.5" fill="#D4AF37" opacity="0.4"/>

  <!-- Decorative triglyphs in frieze -->
  <g fill="#9A7A10" opacity="0.35">
    <rect x="70" y="58" width="8" height="14"/>
    <rect x="90" y="58" width="8" height="14"/>
    <rect x="130" y="58" width="8" height="14"/>
    <rect x="150" y="58" width="8" height="14"/>
    <rect x="190" y="58" width="8" height="14"/>
    <rect x="210" y="58" width="8" height="14"/>
    <rect x="250" y="58" width="8" height="14"/>
    <rect x="270" y="58" width="8" height="14"/>
    <rect x="310" y="58" width="8" height="14"/>
    <rect x="330" y="58" width="8" height="14"/>
  </g>

  <!-- Bottom frieze -->
  <rect x="55" y="490" width="290" height="20" fill="#D4AF37" opacity="0.2"/>
  <rect x="55" y="490" width="290" height="1.5" fill="#D4AF37" opacity="0.5"/>
  <rect x="55" y="509" width="290" height="1.5" fill="#D4AF37" opacity="0.35"/>

  <!-- Gold outer border -->
  <rect x="16" y="16" width="368" height="528" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.5"/>

  <!-- Ancient sun symbol center -->
  <g transform="translate(200,120)" opacity="0.5">
    <circle cx="0" cy="0" r="24" fill="none" stroke="url(#gold)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="14" fill="#D4AF37" opacity="0.25"/>
    <circle cx="0" cy="0" r="6" fill="#D4AF37" opacity="0.5"/>
    <!-- Sun rays -->
    <g stroke="url(#gold)" stroke-width="0.8" opacity="0.6">
      <line x1="0" y1="-30" x2="0" y2="-26"/>
      <line x1="21" y1="-21" x2="18" y2="-18"/>
      <line x1="30" y1="0" x2="26" y2="0"/>
      <line x1="21" y1="21" x2="18" y2="18"/>
      <line x1="0" y1="30" x2="0" y2="26"/>
      <line x1="-21" y1="21" x2="-18" y2="18"/>
      <line x1="-30" y1="0" x2="-26" y2="0"/>
      <line x1="-21" y1="-21" x2="-18" y2="-18"/>
    </g>
  </g>

  <!-- Invitation text -->
  <text x="200" y="166" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#8B6800" opacity="0.55" letter-spacing="3">GRANDEUR CARTHAGINOISE</text>

  <!-- Names gold on cream -->
  <text x="200" y="225" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#5A3A00" font-weight="300" font-style="italic" opacity="0.85">Imen</text>
  <text x="200" y="252" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#D4AF37" opacity="0.6" letter-spacing="5">&amp;</text>
  <text x="200" y="289" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#5A3A00" font-weight="300" font-style="italic" opacity="0.85">Maher</text>

  <!-- Classical divider with palmette -->
  <line x1="75" y1="312" x2="155" y2="312" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>
  <path d="M200 305 Q195 312 190 318 M200 305 Q205 312 210 318 M200 305 Q200 312 200 318 M200 305 Q197 310 193 315 M200 305 Q203 310 207 315" stroke="#D4AF37" stroke-width="0.6" fill="none" opacity="0.5"/>
  <line x1="245" y1="312" x2="325" y2="312" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>

  <!-- Date -->
  <text x="200" y="344" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" fill="#5A3A00" opacity="0.65" letter-spacing="1">Samedi 4 Octobre 2025</text>
  <text x="200" y="367" text-anchor="middle" font-family="Georgia,serif" font-size="8.5" fill="#8B6800" opacity="0.45">Colisée de Carthage, Tunis</text>

  <!-- Ancient wave decoration -->
  <path d="M70 388 Q90 380 110 388 Q130 396 150 388 Q170 380 190 388 Q210 396 230 388 Q250 380 270 388 Q290 396 310 388 Q330 380 350 388" fill="none" stroke="#D4AF37" stroke-width="0.7" opacity="0.3"/>

  <!-- Countdown ancient gold -->
  <g transform="translate(200,432)" opacity="0.8">
    <rect x="-110" y="-20" width="48" height="40" rx="2" fill="#D4AF37" opacity="0.15"/>
    <rect x="-55" y="-20" width="48" height="40" rx="2" fill="#D4AF37" opacity="0.15"/>
    <rect x="7" y="-20" width="48" height="40" rx="2" fill="#D4AF37" opacity="0.15"/>
    <rect x="62" y="-20" width="48" height="40" rx="2" fill="#D4AF37" opacity="0.15"/>
    <rect x="-110" y="-20" width="48" height="40" rx="2" fill="none" stroke="url(#gold)" stroke-width="0.6" opacity="0.5"/>
    <rect x="-55" y="-20" width="48" height="40" rx="2" fill="none" stroke="url(#gold)" stroke-width="0.6" opacity="0.5"/>
    <rect x="7" y="-20" width="48" height="40" rx="2" fill="none" stroke="url(#gold)" stroke-width="0.6" opacity="0.5"/>
    <rect x="62" y="-20" width="48" height="40" rx="2" fill="none" stroke="url(#gold)" stroke-width="0.6" opacity="0.5"/>
    <text x="-86" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#5A3A00" opacity="0.85">72</text>
    <text x="-31" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#5A3A00" opacity="0.85">18</text>
    <text x="31" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#5A3A00" opacity="0.85">30</text>
    <text x="86" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#5A3A00" opacity="0.85">00</text>
    <text x="-86" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#9A7A10" opacity="0.5">JOURS</text>
    <text x="-31" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#9A7A10" opacity="0.5">HEURES</text>
    <text x="31" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#9A7A10" opacity="0.5">MIN</text>
    <text x="86" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#9A7A10" opacity="0.5">SEC</text>
  </g>

  <!-- Gold RSVP button -->
  <rect x="115" y="486" width="170" height="33" rx="2" fill="url(#gold)" opacity="0.85"/>
  <rect x="117" y="488" width="166" height="29" rx="1" fill="none" stroke="#FDF8E8" stroke-width="0.5" opacity="0.35"/>
  <text x="200" y="508" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" fill="#FDF8E8" letter-spacing="3">CONFIRMER</text>

  <text x="200" y="548" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#9A7A10" opacity="0.3" letter-spacing="3">DAAWA · CARTHAGE OR · LUXE</text>
</svg>