<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080E1A"/>
      <stop offset="50%" stop-color="#0F1B2D"/>
      <stop offset="100%" stop-color="#080E1A"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#A0B8D0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>
  <rect width="400" height="560" fill="url(#moonGlow)"/>

  <!-- Stars scattered -->
  <g fill="white">
    <circle cx="45" cy="40" r="1.5" opacity="0.7"/>
    <circle cx="80" cy="65" r="1" opacity="0.5"/>
    <circle cx="120" cy="35" r="2" opacity="0.6"/>
    <circle cx="180" cy="25" r="1" opacity="0.4"/>
    <circle cx="310" cy="42" r="1.5" opacity="0.65"/>
    <circle cx="355" cy="28" r="1" opacity="0.5"/>
    <circle cx="370" cy="68" r="2" opacity="0.7"/>
    <circle cx="40" cy="150" r="1" opacity="0.4"/>
    <circle cx="365" cy="155" r="1.5" opacity="0.5"/>
    <circle cx="55" cy="250" r="1" opacity="0.45"/>
    <circle cx="348" cy="240" r="1" opacity="0.4"/>
    <circle cx="38" cy="360" r="1.5" opacity="0.5"/>
    <circle cx="362" cy="380" r="1" opacity="0.4"/>
    <circle cx="70" cy="440" r="1" opacity="0.3"/>
    <circle cx="338" cy="450" r="1" opacity="0.3"/>
    <!-- Twinkle stars -->
    <circle cx="140" cy="50" r="2.5" opacity="0.8"/>
    <circle cx="260" cy="38" r="2" opacity="0.75"/>
    <circle cx="330" cy="80" r="1.5" opacity="0.6"/>
    <circle cx="60" cy="90" r="1" opacity="0.55"/>
  </g>

  <!-- Moon crescent -->
  <circle cx="200" cy="70" r="28" fill="#D0E0F0" opacity="0.12"/>
  <circle cx="214" cy="65" r="24" fill="#0F1B2D" opacity="1"/>
  <circle cx="200" cy="70" r="28" fill="none" stroke="#A0B8D0" stroke-width="0.5" opacity="0.3"/>

  <!-- Constellation lines -->
  <g stroke="#A0B8D0" stroke-width="0.4" opacity="0.2">
    <line x1="45" y1="40" x2="80" y2="65"/>
    <line x1="80" y1="65" x2="120" y2="35"/>
    <line x1="310" y1="42" x2="355" y2="28"/>
    <line x1="355" y1="28" x2="370" y2="68"/>
  </g>

  <!-- Thin border -->
  <rect x="18" y="18" width="364" height="524" fill="none" stroke="#A0B8D0" stroke-width="0.6" opacity="0.2"/>

  <!-- Silver divider top -->
  <line x1="60" y1="118" x2="340" y2="118" stroke="#A0B8D0" stroke-width="0.6" opacity="0.3"/>
  <circle cx="200" cy="118" r="3" fill="#A0B8D0" opacity="0.4"/>

  <!-- Invitation label -->
  <text x="200" y="143" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="#C8D8E8" opacity="0.5" letter-spacing="4">NUIT ÉTOILÉE</text>

  <!-- Names silver/blue -->
  <text x="200" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#C8D8E8" font-weight="300" font-style="italic" opacity="0.9">Nour</text>
  <text x="200" y="228" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#A0B8D0" opacity="0.5" letter-spacing="5">&amp;</text>
  <text x="200" y="267" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#C8D8E8" font-weight="300" font-style="italic" opacity="0.9">Anis</text>

  <!-- Silver divider -->
  <line x1="80" y1="290" x2="160" y2="290" stroke="#A0B8D0" stroke-width="0.6" opacity="0.35"/>
  <polygon points="200,286 204,290 200,294 196,290" fill="#A0B8D0" opacity="0.4"/>
  <line x1="240" y1="290" x2="320" y2="290" stroke="#A0B8D0" stroke-width="0.6" opacity="0.35"/>

  <!-- Date -->
  <text x="200" y="320" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" fill="#A0B8D0" opacity="0.7" letter-spacing="1">Vendredi 31 Octobre 2025</text>
  <text x="200" y="344" text-anchor="middle" font-family="Georgia,serif" font-size="8.5" fill="#A0B8D0" opacity="0.4">Observatoire, La Marsa</text>

  <!-- Shooting star decoration -->
  <line x1="60" y1="368" x2="130" y2="380" stroke="white" stroke-width="0.8" opacity="0.15"/>
  <circle cx="60" cy="368" r="1.5" fill="white" opacity="0.4"/>
  <line x1="280" y1="362" x2="340" y2="374" stroke="white" stroke-width="0.8" opacity="0.15"/>
  <circle cx="340" cy="374" r="1.5" fill="white" opacity="0.4"/>

  <!-- Countdown -->
  <g transform="translate(200,425)" opacity="0.8">
    <rect x="-110" y="-20" width="48" height="40" rx="4" fill="#A0B8D0" opacity="0.1"/>
    <rect x="-55" y="-20" width="48" height="40" rx="4" fill="#A0B8D0" opacity="0.1"/>
    <rect x="7" y="-20" width="48" height="40" rx="4" fill="#A0B8D0" opacity="0.1"/>
    <rect x="62" y="-20" width="48" height="40" rx="4" fill="#A0B8D0" opacity="0.1"/>
    <rect x="-110" y="-20" width="48" height="40" rx="4" fill="none" stroke="#A0B8D0" stroke-width="0.4" opacity="0.3"/>
    <rect x="-55" y="-20" width="48" height="40" rx="4" fill="none" stroke="#A0B8D0" stroke-width="0.4" opacity="0.3"/>
    <rect x="7" y="-20" width="48" height="40" rx="4" fill="none" stroke="#A0B8D0" stroke-width="0.4" opacity="0.3"/>
    <rect x="62" y="-20" width="48" height="40" rx="4" fill="none" stroke="#A0B8D0" stroke-width="0.4" opacity="0.3"/>
    <text x="-86" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#C8D8E8" opacity="0.9">77</text>
    <text x="-31" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#C8D8E8" opacity="0.9">14</text>
    <text x="31" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#C8D8E8" opacity="0.9">32</text>
    <text x="86" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#C8D8E8" opacity="0.9">08</text>
    <text x="-86" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#A0B8D0" opacity="0.45">JOURS</text>
    <text x="-31" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#A0B8D0" opacity="0.45">HEURES</text>
    <text x="31" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#A0B8D0" opacity="0.45">MIN</text>
    <text x="86" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#A0B8D0" opacity="0.45">SEC</text>
  </g>

  <rect x="130" y="480" width="140" height="32" rx="16" fill="#A0B8D0" opacity="0.25"/>
  <rect x="130" y="480" width="140" height="32" rx="16" fill="none" stroke="#A0B8D0" stroke-width="0.8" opacity="0.4"/>
  <text x="200" y="500" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#C8D8E8" letter-spacing="2">CONFIRMER</text>

  <text x="200" y="545" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#A0B8D0" opacity="0.2" letter-spacing="2">DAAWA · NUIT ÉTOILÉE</text>
</svg>