<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <rect width="400" height="560" fill="#FFFFFF"/>

  <!-- Thin hairline border -->
  <rect x="28" y="28" width="344" height="504" fill="none" stroke="#333333" stroke-width="0.5" opacity="0.15"/>

  <!-- Single accent bar top -->
  <rect x="170" y="40" width="60" height="1.5" fill="#999999" opacity="0.5"/>

  <!-- Invitation tag tiny -->
  <text x="200" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="7" fill="#999999" opacity="0.6" letter-spacing="5">INVITATION</text>

  <!-- Minimal monogram -->
  <text x="200" y="160" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#333333" opacity="0.08" font-weight="300">Y&amp;K</text>

  <!-- Names ultra clean -->
  <text x="200" y="215" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#1A1A1A" font-weight="200" letter-spacing="8" opacity="0.85">YASMINE</text>
  <text x="200" y="238" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#999999" opacity="0.5">&amp;</text>
  <text x="200" y="266" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#1A1A1A" font-weight="200" letter-spacing="8" opacity="0.85">KARIM</text>

  <!-- Hairline divider -->
  <line x1="155" y1="290" x2="245" y2="290" stroke="#333" stroke-width="0.5" opacity="0.2"/>

  <!-- Date and location -->
  <text x="200" y="320" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" opacity="0.55" letter-spacing="2" font-weight="300">14 · 06 · 2025</text>
  <text x="200" y="344" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="8.5" fill="#999999" opacity="0.5" letter-spacing="1">Tunis, Tunisie</text>

  <!-- Minimal dots separator -->
  <circle cx="186" cy="368" r="1.5" fill="#999" opacity="0.3"/>
  <circle cx="200" cy="368" r="1.5" fill="#999" opacity="0.3"/>
  <circle cx="214" cy="368" r="1.5" fill="#999" opacity="0.3"/>

  <!-- Countdown — ultra minimal grid -->
  <g transform="translate(200,415)" opacity="0.65">
    <line x1="-110" y1="-20" x2="-110" y2="20" stroke="#ddd" stroke-width="1"/>
    <line x1="-50" y1="-20" x2="-50" y2="20" stroke="#ddd" stroke-width="1"/>
    <line x1="10" y1="-20" x2="10" y2="20" stroke="#ddd" stroke-width="1"/>
    <line x1="70" y1="-20" x2="70" y2="20" stroke="#ddd" stroke-width="1"/>
    <line x1="110" y1="-20" x2="110" y2="20" stroke="#ddd" stroke-width="1"/>
    <text x="-80" y="5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1A1A1A" font-weight="100">42</text>
    <text x="-20" y="5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1A1A1A" font-weight="100">18</text>
    <text x="40" y="5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1A1A1A" font-weight="100">05</text>
    <text x="90" y="5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1A1A1A" font-weight="100">33</text>
    <text x="-80" y="18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="5.5" fill="#999" letter-spacing="1">J</text>
    <text x="-20" y="18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="5.5" fill="#999" letter-spacing="1">H</text>
    <text x="40" y="18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="5.5" fill="#999" letter-spacing="1">M</text>
    <text x="90" y="18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="5.5" fill="#999" letter-spacing="1">S</text>
  </g>

  <!-- RSVP minimal button outline -->
  <rect x="150" y="465" width="100" height="30" rx="0" fill="none" stroke="#1A1A1A" stroke-width="1" opacity="0.4"/>
  <text x="200" y="484" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#1A1A1A" letter-spacing="4" opacity="0.7">RSVP</text>

  <!-- Bottom single bar -->
  <rect x="170" y="520" width="60" height="1" fill="#999999" opacity="0.3"/>

  <text x="200" y="545" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="6.5" fill="#999" opacity="0.3" letter-spacing="3">DAAWA · MINIMALISTE</text>
</svg>