    <rect x="-55" y="-20" width="48" height="40" rx="8" fill="#4A6B3A" opacity="0.12"/>
    <rect x="7" y="-20" width="48" height="40" rx="8" fill="#4A6B3A" opacity="0.12"/>
    <rect x="62" y="-20" width="48" height="40" rx="8" fill="#4A6B3A" opacity="0.12"/>
