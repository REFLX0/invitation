  <rect x="130" y="480" width="140" height="32" rx="16" fill="#4A6B3A" opacity="0.8"/>
  <text x="200" y="500" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="white" letter-spacing="2">RSVP</text>

  <text x="200" y="545" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#4A6B3A" opacity="0.3" letter-spacing="2">DAAWA · JARDIN SECRET</text>
</svg>