    <text x="-86" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#4A6B3A" opacity="0.45">JOURS</text>
    <text x="-31" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#4A6B3A" opacity="0.45">HEURES</text>
    <text x="31" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#4A6B3A" opacity="0.45">MIN</text>
    <text x="86" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#4A6B3A" opacity="0.45">SEC</text>
