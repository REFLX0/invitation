<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF7F2"/>
      <stop offset="100%" stop-color="#F3EDE3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B2252"/>
      <stop offset="100%" stop-color="#B03070"/>
    </linearGradient>
    <pattern id="lattice" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 L10 0 L20 10 L10 20 Z" fill="none" stroke="#8B2252" stroke-width="0.3" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg)"/>
  <rect width="400" height="560" fill="url(#lattice)"/>

  <!-- Outer border frame -->
  <rect x="16" y="16" width="368" height="528" fill="none" stroke="#8B2252" stroke-width="0.8" opacity="0.25"/>
  <rect x="22" y="22" width="356" height="516" fill="none" stroke="#8B2252" stroke-width="0.4" opacity="0.15"/>

  <!-- Corner ornaments -->
  <g opacity="0.4" fill="#8B2252">
    <!-- TL -->
    <path d="M16 16 L40 16 L40 18 L18 18 L18 40 L16 40 Z"/>
    <circle cx="30" cy="30" r="3"/>
    <!-- TR -->
    <path d="M384 16 L360 16 L360 18 L382 18 L382 40 L384 40 Z"/>
    <circle cx="370" cy="30" r="3"/>
    <!-- BL -->
    <path d="M16 544 L40 544 L40 542 L18 542 L18 520 L16 520 Z"/>
    <circle cx="30" cy="530" r="3"/>
    <!-- BR -->
    <path d="M384 544 L360 544 L360 542 L382 542 L382 520 L384 520 Z"/>
    <circle cx="370" cy="530" r="3"/>
  </g>

  <!-- Top ornamental divider -->
  <line x1="60" y1="100" x2="340" y2="100" stroke="#8B2252" stroke-width="0.6" opacity="0.3"/>
  <text x="200" y="104" text-anchor="middle" font-size="8" fill="#8B2252" opacity="0.5">✦</text>
  <line x1="60" y1="108" x2="340" y2="108" stroke="#8B2252" stroke-width="0.3" opacity="0.15"/>

  <!-- Decorative monogram area -->
  <ellipse cx="200" cy="75" rx="28" ry="28" fill="none" stroke="#8B2252" stroke-width="0.8" opacity="0.3"/>
  <ellipse cx="200" cy="75" rx="22" ry="22" fill="#8B2252" opacity="0.08"/>
  <text x="200" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#8B2252" opacity="0.7" font-style="italic">E</text>

  <!-- Cordialement invités -->
  <text x="200" y="130" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#8B2252" opacity="0.55" letter-spacing="4">VOUS ÊTES CORDIALEMENT</text>
  <text x="200" y="142" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#8B2252" opacity="0.55" letter-spacing="4">INVITÉS AU MARIAGE DE</text>

  <!-- Names -->
  <text x="200" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#8B2252" font-weight="300" opacity="0.9" font-style="italic">Yasmine</text>
  <text x="200" y="232" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#8B2252" opacity="0.4" letter-spacing="3">&amp;</text>
  <text x="200" y="262" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#8B2252" font-weight="300" opacity="0.9" font-style="italic">Karim</text>

  <!-- Divider -->
  <line x1="100" y1="285" x2="300" y2="285" stroke="#8B2252" stroke-width="0.5" opacity="0.25"/>
  <circle cx="200" cy="285" r="3" fill="#8B2252" opacity="0.3"/>

  <!-- Date -->
  <text x="200" y="315" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8B2252" opacity="0.6" letter-spacing="2">Samedi 14 Juin 2025</text>

  <!-- Venue -->
  <text x="200" y="345" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#8B2252" opacity="0.45" letter-spacing="1">Palais des Roses, Tunis</text>

  <!-- Countdown boxes -->
  <g transform="translate(200, 395)" opacity="0.75">
    <rect x="-120" y="-20" width="50" height="40" rx="6" fill="none" stroke="#8B2252" stroke-width="0.6" opacity="0.3"/>
    <rect x="-55" y="-20" width="50" height="40" rx="6" fill="none" stroke="#8B2252" stroke-width="0.6" opacity="0.3"/>
    <rect x="5" y="-20" width="50" height="40" rx="6" fill="none" stroke="#8B2252" stroke-width="0.6" opacity="0.3"/>
    <rect x="70" y="-20" width="50" height="40" rx="6" fill="none" stroke="#8B2252" stroke-width="0.6" opacity="0.3"/>
    <text x="-95" y="7" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#8B2252" opacity="0.8">42</text>
    <text x="-30" y="7" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#8B2252" opacity="0.8">18</text>
    <text x="30" y="7" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#8B2252" opacity="0.8">05</text>
    <text x="95" y="7" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#8B2252" opacity="0.8">33</text>
    <text x="-95" y="20" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#8B2252" opacity="0.4">JOURS</text>
    <text x="-30" y="20" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#8B2252" opacity="0.4">HEURES</text>
    <text x="30" y="20" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#8B2252" opacity="0.4">MIN</text>
    <text x="95" y="20" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#8B2252" opacity="0.4">SEC</text>
  </g>

  <!-- RSVP button -->
  <rect x="120" y="450" width="160" height="34" rx="17" fill="#8B2252" opacity="0.85"/>
  <text x="200" y="472" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white" letter-spacing="2">RSVP</text>

  <!-- Bottom ornamental divider -->
  <line x1="80" y1="508" x2="320" y2="508" stroke="#8B2252" stroke-width="0.5" opacity="0.2"/>
  <text x="200" y="524" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#8B2252" opacity="0.3" letter-spacing="2">DAAWA · ELEGANCE</text>
</svg>