<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">

  <rect width="400" height="300" fill="#FBF7F2"/>
  <!-- Elegant border -->
  <rect x="20" y="20" width="360" height="260" rx="2" fill="none" stroke="#8B2252" stroke-width="1" opacity="0.3"/>
  <!-- Ornamental lines -->
  <line x1="60" y1="100" x2="340" y2="100" stroke="#8B2252" stroke-width="0.5" opacity="0.4"/>
  <line x1="60" y1="200" x2="340" y2="200" stroke="#8B2252" stroke-width="0.5" opacity="0.4"/>
  <!-- Diamond divider -->
  <polygon points="200,95 208,100 200,105 192,100" fill="#8B2252" opacity="0.3"/>
  <!-- Names -->
  <text x="200" y="135" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="300" fill="#8B2252">Ahmed</text>
  <text x="200" y="158" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#8B2252" opacity="0.7">&amp;</text>
  <text x="200" y="180" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="300" fill="#8B2252">Fatima</text>
  <!-- Bottom diamond -->
  <polygon points="200,195 208,200 200,205 192,200" fill="#8B2252" opacity="0.3"/>
  <!-- Date -->
  <text x="200" y="240" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#8B2252" opacity="0.5">15 Juin 2025</text>
  <!-- Label -->
  <text x="200" y="270" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#8B2252" opacity="0.3">ELEGANCE</text>
</svg>