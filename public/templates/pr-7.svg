<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF7F2"/>
      <stop offset="100%" stop-color="#DDF0E8"/>
    </linearGradient>
    <radialGradient id="waterGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#5A9B7A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>
  <rect width="400" height="560" fill="url(#waterGlow)"/>

  <!-- Water ripple circles bottom -->
  <g fill="none" stroke="#5A9B7A" opacity="0.12">
    <circle cx="200" cy="540" r="80"/>
    <circle cx="200" cy="540" r="120"/>
    <circle cx="200" cy="540" r="160"/>
    <circle cx="200" cy="540" r="200"/>
  </g>

  <!-- Palm trees silhouette -->
  <g opacity="0.18" fill="#2A5A3A">
    <!-- Left palm -->
    <rect x="55" y="180" width="6" height="140" rx="3"/>
    <path d="M58 180 Q20 140 10 110 Q35 125 58 155Z"/>
    <path d="M58 180 Q15 160 5 135 Q32 148 55 168Z"/>
    <path d="M58 180 Q80 135 95 110 Q78 130 62 158Z"/>
    <path d="M58 180 Q88 158 100 135 Q82 152 63 172Z"/>
    <!-- Right palm -->
    <rect x="339" y="180" width="6" height="140" rx="3"/>
    <path d="M342 180 Q380 140 390 110 Q365 125 342 155Z"/>
    <path d="M342 180 Q385 160 395 135 Q368 148 345 168Z"/>
    <path d="M342 180 Q320 135 305 110 Q322 130 338 158Z"/>
    <path d="M342 180 Q312 158 300 135 Q318 152 337 172Z"/>
  </g>

  <!-- Mediterranean water band -->
  <path d="M0 460 Q80 450 160 460 Q240 470 320 458 Q360 453 400 460 L400 560 L0 560Z" fill="#3A7B5A" opacity="0.15"/>
  <path d="M0 475 Q100 465 200 475 Q300 485 400 472 L400 560 L0 560Z" fill="#5A9B7A" opacity="0.1"/>

  <!-- Sun/sky glow top -->
  <ellipse cx="200" cy="30" rx="120" ry="50" fill="#A0D0B8" opacity="0.2"/>

  <!-- Thin border -->
  <rect x="20" y="20" width="360" height="520" fill="none" stroke="#3A7B5A" stroke-width="0.7" opacity="0.3"/>

  <!-- Leaf side accents -->
  <g fill="#3A7B5A" opacity="0.2">
    <ellipse cx="32" cy="220" rx="20" ry="8" transform="rotate(-40 32 220)"/>
    <ellipse cx="28" cy="240" rx="16" ry="7" transform="rotate(-30 28 240)"/>
    <ellipse cx="368" cy="220" rx="20" ry="8" transform="rotate(40 368 220)"/>
    <ellipse cx="372" cy="240" rx="16" ry="7" transform="rotate(30 372 240)"/>
  </g>

  <!-- Title -->
  <text x="200" y="85" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#3A7B5A" opacity="0.55" letter-spacing="3">OASIS MÉDITERRANÉENNE</text>

  <!-- Names fresh green -->
  <text x="200" y="145" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#1E4A30" font-weight="300" font-style="italic" opacity="0.85">Hajar</text>
  <text x="200" y="172" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#5A9B7A" opacity="0.6" letter-spacing="4">&amp;</text>
  <text x="200" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#1E4A30" font-weight="300" font-style="italic" opacity="0.85">Oussama</text>

