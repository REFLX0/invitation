    <rect x="-55" y="-18" width="48" height="36" rx="10" fill="#3A7B5A" opacity="0.15"/>
    <rect x="7" y="-18" width="48" height="36" rx="10" fill="#3A7B5A" opacity="0.15"/>
    <rect x="62" y="-18" width="48" height="36" rx="10" fill="#3A7B5A" opacity="0.15"/>
    <text x="-86" y="5" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#1E4A30" opacity="0.8">25</text>
    <text x="-31" y="5" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#1E4A30" opacity="0.8">09</text>
    <text x="31" y="5" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#1E4A30" opacity="0.8">40</text>
    <text x="86" y="5" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#1E4A30" opacity="0.8">12</text>
    <text x="-86" y="17" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#3A7B5A" opacity="0.45">J</text>
    <text x="-31" y="17" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#3A7B5A" opacity="0.45">H</text>
    <text x="31" y="17" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#3A7B5A" opacity="0.45">M</text>
    <text x="86" y="17" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#3A7B5A" opacity="0.45">S</text>
  </g>

  <rect x="130" y="420" width="140" height="32" rx="16" fill="#3A7B5A" opacity="0.8"/>
  <text x="200" y="440" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="white" letter-spacing="2">RSVP</text>

  <text x="200" y="545" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#3A7B5A" opacity="0.3" letter-spacing="2">DAAWA · OASIS</text>
</svg>