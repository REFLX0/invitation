  <line x1="80" y1="232" x2="150" y2="232" stroke="#3A7B5A" stroke-width="0.6" opacity="0.35"/>
  <ellipse cx="200" cy="232" rx="12" ry="5" fill="#3A7B5A" opacity="0.25"/>
  <line x1="250" y1="232" x2="320" y2="232" stroke="#3A7B5A" stroke-width="0.6" opacity="0.35"/>

  <!-- Date -->
  <text x="200" y="262" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" fill="#1E4A30" opacity="0.65" letter-spacing="1">Vendredi 6 Juin 2025</text>
  <text x="200" y="285" text-anchor="middle" font-family="Georgia,serif" font-size="8.5" fill="#3A7B5A" opacity="0.45">Resort Oasis, Tabarka</text>

