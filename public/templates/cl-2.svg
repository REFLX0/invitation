<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5F8"/>
      <stop offset="100%" stop-color="#FFE8EF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>

  <!-- Scattered petals background -->
  <g opacity="0.12" fill="#D4859A">
    <ellipse cx="60" cy="80" rx="18" ry="8" transform="rotate(-30 60 80)"/>
    <ellipse cx="340" cy="120" rx="15" ry="7" transform="rotate(45 340 120)"/>
    <ellipse cx="80" cy="400" rx="20" ry="9" transform="rotate(-60 80 400)"/>
    <ellipse cx="350" cy="360" rx="16" ry="7" transform="rotate(20 350 360)"/>
    <ellipse cx="30" cy="280" rx="12" ry="6" transform="rotate(10 30 280)"/>
    <ellipse cx="370" cy="260" rx="14" ry="6" transform="rotate(-40 370 260)"/>
    <ellipse cx="160" cy="50" rx="10" ry="5" transform="rotate(25 160 50)"/>
    <ellipse cx="250" cy="510" rx="13" ry="6" transform="rotate(-15 250 510)"/>
    <ellipse cx="120" cy="480" rx="11" ry="5" transform="rotate(55 120 480)"/>
    <ellipse cx="300" cy="490" rx="12" ry="5" transform="rotate(-35 300 490)"/>
  </g>

  <!-- Floral arch top -->
  <g opacity="0.5">
    <!-- Large roses -->
    <circle cx="200" cy="55" r="22" fill="#D4859A" opacity="0.25"/>
    <circle cx="200" cy="55" r="15" fill="#D4859A" opacity="0.3"/>
    <circle cx="200" cy="55" r="8" fill="#D4859A" opacity="0.4"/>
    <!-- Left flowers -->
    <circle cx="130" cy="85" r="16" fill="#E8A0B0" opacity="0.3"/>
    <circle cx="130" cy="85" r="9" fill="#D4859A" opacity="0.4"/>
    <circle cx="90" cy="120" r="12" fill="#EBB0C0" opacity="0.25"/>
    <circle cx="90" cy="120" r="7" fill="#D4859A" opacity="0.35"/>
    <!-- Right flowers -->
    <circle cx="270" cy="85" r="16" fill="#E8A0B0" opacity="0.3"/>
    <circle cx="270" cy="85" r="9" fill="#D4859A" opacity="0.4"/>
    <circle cx="310" cy="120" r="12" fill="#EBB0C0" opacity="0.25"/>
    <circle cx="310" cy="120" r="7" fill="#D4859A" opacity="0.35"/>
    <!-- Stems/leaves -->
    <path d="M170 65 Q150 90 130 85" stroke="#6B8F71" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M230 65 Q250 90 270 85" stroke="#6B8F71" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M140 95 Q115 115 90 120" stroke="#6B8F71" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M260 95 Q285 115 310 120" stroke="#6B8F71" stroke-width="1" fill="none" opacity="0.3"/>
    <!-- Leaf shapes -->
    <ellipse cx="155" cy="78" rx="10" ry="5" transform="rotate(-30 155 78)" fill="#6B8F71" opacity="0.35"/>
    <ellipse cx="245" cy="78" rx="10" ry="5" transform="rotate(30 245 78)" fill="#6B8F71" opacity="0.35"/>
  </g>

  <!-- Outer frame -->
  <rect x="30" y="30" width="340" height="500" fill="none" stroke="#D4859A" stroke-width="1" opacity="0.3" rx="2"/>

  <!-- Invitation text -->
  <text x="200" y="160" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#D4859A" opacity="0.6" letter-spacing="3">MARIAGE DE</text>

  <!-- Names with script feel -->
  <text x="200" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#8B5A70" font-weight="300" font-style="italic" opacity="0.85">Amira</text>
  <text x="200" y="240" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#D4859A" opacity="0.5" letter-spacing="4">&amp;</text>
  <text x="200" y="276" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#8B5A70" font-weight="300" font-style="italic" opacity="0.85">Nizar</text>

  <!-- Floral divider -->
  <line x1="80" y1="298" x2="160" y2="298" stroke="#D4859A" stroke-width="0.6" opacity="0.35"/>
  <circle cx="200" cy="298" r="4" fill="none" stroke="#D4859A" stroke-width="0.8" opacity="0.5"/>
  <circle cx="200" cy="298" r="2" fill="#D4859A" opacity="0.4"/>
  <line x1="240" y1="298" x2="320" y2="298" stroke="#D4859A" stroke-width="0.6" opacity="0.35"/>

  <!-- Date -->
  <text x="200" y="328" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8B5A70" opacity="0.65" letter-spacing="1.5">Dimanche 20 Avril 2025</text>

  <!-- Venue -->
  <text x="200" y="355" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#8B5A70" opacity="0.45">Salle des Fleurs, Hammamet</text>

  <!-- Small floral details mid page -->
  <g opacity="0.35" fill="#D4859A" transform="translate(200, 388)">
    <circle cx="0" cy="0" r="6"/>
    <circle cx="-25" cy="8" r="4"/>
    <circle cx="25" cy="8" r="4"/>
    <ellipse cx="-40" cy="0" rx="8" ry="4" transform="rotate(-20 -40 0)"/>
    <ellipse cx="40" cy="0" rx="8" ry="4" transform="rotate(20 40 0)"/>
  </g>

  <!-- Countdown -->
  <g opacity="0.75" transform="translate(200, 440)">
    <rect x="-110" y="-18" width="46" height="36" rx="8" fill="#D4859A" opacity="0.15"/>
    <rect x="-55" y="-18" width="46" height="36" rx="8" fill="#D4859A" opacity="0.15"/>
    <rect x="8" y="-18" width="46" height="36" rx="8" fill="#D4859A" opacity="0.15"/>
    <rect x="63" y="-18" width="46" height="36" rx="8" fill="#D4859A" opacity="0.15"/>
    <text x="-87" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#8B5A70" opacity="0.8">28</text>
    <text x="-32" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#8B5A70" opacity="0.8">14</text>
    <text x="31" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#8B5A70" opacity="0.8">07</text>
    <text x="86" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#8B5A70" opacity="0.8">22</text>
    <text x="-87" y="18" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#D4859A" opacity="0.5">J</text>
    <text x="-32" y="18" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#D4859A" opacity="0.5">H</text>
    <text x="31" y="18" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#D4859A" opacity="0.5">M</text>
    <text x="86" y="18" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#D4859A" opacity="0.5">S</text>
  </g>

  <!-- RSVP -->
  <rect x="130" y="492" width="140" height="32" rx="16" fill="#D4859A" opacity="0.85"/>
  <text x="200" y="513" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white" letter-spacing="2">CONFIRMER</text>

  <!-- Bottom tag -->
  <text x="200" y="546" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#D4859A" opacity="0.3" letter-spacing="2">DAAWA · FLEUR DE LYS</text>
</svg>