<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5EDE0"/>
      <stop offset="100%" stop-color="#EAD8C0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>

  <!-- Zellige-inspired geometric pattern top -->
  <g opacity="0.35">
    <!-- 8-pointed stars row -->
    <g fill="#B8860B" transform="translate(40,40)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
    </g>
    <g fill="#8B5E3C" transform="translate(80,40)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
    </g>
    <g fill="#B8860B" transform="translate(120,40)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
    </g>
    <g fill="#8B5E3C" transform="translate(160,40)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
    </g>
    <g fill="#B8860B" transform="translate(200,40)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
    </g>
    <g fill="#8B5E3C" transform="translate(240,40)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
    </g>
    <g fill="#B8860B" transform="translate(280,40)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
    </g>
    <g fill="#8B5E3C" transform="translate(320,40)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
    </g>
    <g fill="#B8860B" transform="translate(360,40)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
    </g>
    <!-- Pattern grid lines -->
    <line x1="0" y1="24" x2="400" y2="24" stroke="#8B5E3C" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="56" x2="400" y2="56" stroke="#8B5E3C" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Bottom band same pattern -->
  <g opacity="0.3" transform="translate(0,504)">
    <g fill="#B8860B" transform="translate(40,16)"><polygon points="0,-14 3,-4 14,0 3,4 0,14 -3,4 -14,0 -3,-4"/></g>
    <g fill="#8B5E3C" transform="translate(80,16)"><polygon points="0,-14 3,-4 14,0 3,4 0,14 -3,4 -14,0 -3,-4"/></g>
    <g fill="#B8860B" transform="translate(120,16)"><polygon points="0,-14 3,-4 14,0 3,4 0,14 -3,4 -14,0 -3,-4"/></g>
    <g fill="#8B5E3C" transform="translate(160,16)"><polygon points="0,-14 3,-4 14,0 3,4 0,14 -3,4 -14,0 -3,-4"/></g>
    <g fill="#B8860B" transform="translate(200,16)"><polygon points="0,-14 3,-4 14,0 3,4 0,14 -3,4 -14,0 -3,-4"/></g>
    <g fill="#8B5E3C" transform="translate(240,16)"><polygon points="0,-14 3,-4 14,0 3,4 0,14 -3,4 -14,0 -3,-4"/></g>
    <g fill="#B8860B" transform="translate(280,16)"><polygon points="0,-14 3,-4 14,0 3,4 0,14 -3,4 -14,0 -3,-4"/></g>
    <g fill="#8B5E3C" transform="translate(320,16)"><polygon points="0,-14 3,-4 14,0 3,4 0,14 -3,4 -14,0 -3,-4"/></g>
    <g fill="#B8860B" transform="translate(360,16)"><polygon points="0,-14 3,-4 14,0 3,4 0,14 -3,4 -14,0 -3,-4"/></g>
    <line x1="0" y1="2" x2="400" y2="2" stroke="#8B5E3C" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="30" x2="400" y2="30" stroke="#8B5E3C" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Side arch pattern -->
  <g stroke="#B8860B" fill="none" opacity="0.2" stroke-width="0.6">
    <path d="M20 60 L20 500"/>
    <path d="M20 80 Q40 80 40 100 Q40 120 20 120"/>
    <path d="M20 140 Q40 140 40 160 Q40 180 20 180"/>
    <path d="M20 200 Q40 200 40 220 Q40 240 20 240"/>
    <path d="M20 260 Q40 260 40 280 Q40 300 20 300"/>
    <path d="M20 320 Q40 320 40 340 Q40 360 20 360"/>
    <path d="M20 380 Q40 380 40 400 Q40 420 20 420"/>
    <path d="M20 440 Q40 440 40 460 Q40 480 20 480"/>
    <path d="M380 60 L380 500"/>
    <path d="M380 80 Q360 80 360 100 Q360 120 380 120"/>
    <path d="M380 140 Q360 140 360 160 Q360 180 380 180"/>
    <path d="M380 200 Q360 200 360 220 Q360 240 380 240"/>
    <path d="M380 260 Q360 260 360 280 Q360 300 380 300"/>
  </g>

  <!-- Medina arch top -->
  <path d="M100 100 Q200 60 300 100" fill="none" stroke="#8B5E3C" stroke-width="1.2" opacity="0.35"/>
  <path d="M90 105 Q200 62 310 105" fill="none" stroke="#B8860B" stroke-width="0.5" opacity="0.2"/>

  <!-- Center star ornament -->
  <g transform="translate(200,138)" fill="#B8860B" opacity="0.5">
    <polygon points="0,-14 3,-4 14,0 3,4 0,14 -3,4 -14,0 -3,-4"/>
  </g>

  <!-- Invitation text -->
  <text x="200" y="174" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#8B5E3C" opacity="0.55" letter-spacing="3">ESPRIT MÉDINA</text>

  <!-- Names -->
  <text x="200" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#5A3820" font-weight="300" font-style="italic" opacity="0.85">Khaoula</text>
  <text x="200" y="256" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#B8860B" opacity="0.55" letter-spacing="4">&amp;</text>
  <text x="200" y="292" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#5A3820" font-weight="300" font-style="italic" opacity="0.85">Walid</text>

  <!-- Divider -->
  <line x1="80" y1="314" x2="160" y2="314" stroke="#B8860B" stroke-width="0.7" opacity="0.4"/>
  <g transform="translate(200,314)" fill="#B8860B" opacity="0.5">
    <polygon points="0,-4 2,-1 4,0 2,1 0,4 -2,1 -4,0 -2,-1"/>
  </g>
  <line x1="240" y1="314" x2="320" y2="314" stroke="#B8860B" stroke-width="0.7" opacity="0.4"/>

  <text x="200" y="344" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" fill="#5A3820" opacity="0.65" letter-spacing="1">Vendredi 8 Août 2025</text>
  <text x="200" y="366" text-anchor="middle" font-family="Georgia,serif" font-size="8.5" fill="#8B5E3C" opacity="0.45">Dar Ben Abdallah, Tunis</text>

  <!-- Countdown -->
  <g transform="translate(200,412)" opacity="0.75">
    <rect x="-110" y="-18" width="48" height="36" rx="3" fill="#B8860B" opacity="0.12"/>
    <rect x="-55" y="-18" width="48" height="36" rx="3" fill="#8B5E3C" opacity="0.12"/>
    <rect x="7" y="-18" width="48" height="36" rx="3" fill="#B8860B" opacity="0.12"/>
    <rect x="62" y="-18" width="48" height="36" rx="3" fill="#8B5E3C" opacity="0.12"/>
    <text x="-86" y="5" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#5A3820" opacity="0.8">30</text>
    <text x="-31" y="5" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#5A3820" opacity="0.8">11</text>
    <text x="31" y="5" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#5A3820" opacity="0.8">58</text>
    <text x="86" y="5" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#5A3820" opacity="0.8">30</text>
    <text x="-86" y="17" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#8B5E3C" opacity="0.45">J</text>
    <text x="-31" y="17" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#8B5E3C" opacity="0.45">H</text>
    <text x="31" y="17" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#8B5E3C" opacity="0.45">M</text>
    <text x="86" y="17" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#8B5E3C" opacity="0.45">S</text>
  </g>

  <rect x="130" y="462" width="140" height="32" rx="3" fill="#B8860B" opacity="0.75"/>
  <text x="200" y="482" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="white" letter-spacing="2">RSVP</text>

  <text x="200" y="545" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#8B5E3C" opacity="0.3" letter-spacing="2">DAAWA · MÉDINA</text>
</svg>