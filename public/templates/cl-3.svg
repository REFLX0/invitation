<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDF3F8"/>
      <stop offset="40%" stop-color="#F5F0EB"/>
      <stop offset="100%" stop-color="#EBF0F5"/>
    </linearGradient>
    <filter id="blur-soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>

  <!-- Watercolor washes -->
  <ellipse cx="100" cy="120" rx="120" ry="80" fill="#8BAAC8" opacity="0.12" filter="url(#blur-soft)"/>
  <ellipse cx="320" cy="200" rx="100" ry="100" fill="#C8A0D4" opacity="0.1" filter="url(#blur-soft)"/>
  <ellipse cx="80" cy="380" rx="100" ry="80" fill="#A8C4A0" opacity="0.1" filter="url(#blur-soft)"/>
  <ellipse cx="340" cy="440" rx="90" ry="70" fill="#D4A0B0" opacity="0.1" filter="url(#blur-soft)"/>
  <ellipse cx="200" cy="300" rx="150" ry="100" fill="#A8C0D8" opacity="0.07" filter="url(#blur-soft)"/>

  <!-- Thin elegant border -->
  <rect x="24" y="24" width="352" height="512" fill="none" stroke="#6B7B8D" stroke-width="0.6" opacity="0.2" rx="1"/>

  <!-- Watercolor splash top -->
  <g opacity="0.35">
    <ellipse cx="200" cy="70" rx="60" ry="30" fill="#8BAAC8" opacity="0.3"/>
    <ellipse cx="170" cy="80" rx="30" ry="15" fill="#A8C4D8" opacity="0.25"/>
    <ellipse cx="230" cy="75" rx="25" ry="12" fill="#C0D0E0" opacity="0.2"/>
    <ellipse cx="200" cy="60" rx="40" ry="18" fill="#7A9AB8" opacity="0.25"/>
  </g>

  <!-- Watercolor leaf accents -->
  <g opacity="0.3">
    <ellipse cx="80" cy="200" rx="30" ry="12" transform="rotate(-45 80 200)" fill="#A8C4A0"/>
    <ellipse cx="320" cy="180" rx="25" ry="10" transform="rotate(45 320 180)" fill="#A8C4A0"/>
    <ellipse cx="60" cy="350" rx="20" ry="8" transform="rotate(-30 60 350)" fill="#B0C8B0"/>
    <ellipse cx="340" cy="330" rx="18" ry="7" transform="rotate(30 340 330)" fill="#B0C8B0"/>
  </g>

  <!-- Invitation label -->
  <text x="200" y="148" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#6B7B8D" opacity="0.5" letter-spacing="3.5">INVITATION AU MARIAGE</text>

  <!-- Names -->
  <text x="200" y="205" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#4A5E6D" font-weight="300" font-style="italic" opacity="0.8">Rania</text>
  <text x="200" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8BAAC8" opacity="0.7" letter-spacing="5">&amp;</text>
  <text x="200" y="265" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#4A5E6D" font-weight="300" font-style="italic" opacity="0.8">Fares</text>

  <!-- Watercolor brush stroke divider -->
  <ellipse cx="200" cy="288" rx="80" ry="3" fill="#8BAAC8" opacity="0.2"/>
  <ellipse cx="200" cy="288" rx="40" ry="1.5" fill="#8BAAC8" opacity="0.3"/>

  <!-- Date -->
  <text x="200" y="318" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" fill="#4A5E6D" opacity="0.6" letter-spacing="1">Vendredi 5 Septembre 2025</text>

  <!-- Venue -->
  <text x="200" y="345" text-anchor="middle" font-family="Georgia,serif" font-size="8.5" fill="#6B7B8D" opacity="0.45">Villa Bleue, Sidi Bou Said</text>

  <!-- Watercolor swash bottom left -->
  <g opacity="0.2">
    <ellipse cx="100" cy="420" rx="60" ry="20" transform="rotate(-20 100 420)" fill="#C0D0E8"/>
    <ellipse cx="300" cy="410" rx="50" ry="18" transform="rotate(15 300 410)" fill="#D4A0C0"/>
  </g>

  <!-- Countdown soft boxes -->
  <g opacity="0.7" transform="translate(200,450)">
    <rect x="-108" y="-18" width="46" height="36" rx="10" fill="#8BAAC8" opacity="0.18"/>
    <rect x="-53" y="-18" width="46" height="36" rx="10" fill="#A8C4D8" opacity="0.15"/>
    <rect x="7" y="-18" width="46" height="36" rx="10" fill="#C8B0C8" opacity="0.15"/>
    <rect x="62" y="-18" width="46" height="36" rx="10" fill="#D4A8B8" opacity="0.15"/>
    <text x="-85" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4A5E6D" opacity="0.7">60</text>
    <text x="-30" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4A5E6D" opacity="0.7">12</text>
    <text x="30" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4A5E6D" opacity="0.7">45</text>
    <text x="85" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4A5E6D" opacity="0.7">00</text>
    <text x="-85" y="18" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#6B7B8D" opacity="0.45">JOURS</text>
    <text x="-30" y="18" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#6B7B8D" opacity="0.45">HEURES</text>
    <text x="30" y="18" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#6B7B8D" opacity="0.45">MIN</text>
    <text x="85" y="18" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#6B7B8D" opacity="0.45">SEC</text>
  </g>

  <!-- RSVP -->
  <rect x="140" y="498" width="120" height="30" rx="15" fill="#8BAAC8" opacity="0.7"/>
  <text x="200" y="518" text-anchor="middle" font-family="sans-serif" font-size="9" fill="white" letter-spacing="2">RSVP</text>

  <text x="200" y="546" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#6B7B8D" opacity="0.25" letter-spacing="2">DAAWA · AQUARELLE</text>
</svg>