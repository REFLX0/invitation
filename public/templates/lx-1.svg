<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">

  <rect width="400" height="300" fill="#0A0A0A"/>
  <!-- Art deco gold frame -->
  <rect x="20" y="20" width="360" height="260" fill="none" stroke="#C6A664" stroke-width="1.5" opacity="0.4"/>
  <rect x="30" y="30" width="340" height="240" fill="none" stroke="#C6A664" stroke-width="0.5" opacity="0.2"/>
  <!-- Art deco corners -->
  <g stroke="#C6A664" stroke-width="2" opacity="0.5" fill="none">
    <path d="M20,50 L20,20 L50,20"/>
    <path d="M380,50 L380,20 L350,20"/>
    <path d="M20,250 L20,280 L50,280"/>
    <path d="M380,250 L380,280 L350,280"/>
  </g>
  <!-- Fan/sunburst at top -->
  <g transform="translate(200,55)" opacity="0.2">
    <line x1="0" y1="0" x2="-30" y2="-20" stroke="#C6A664" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-15" y2="-25" stroke="#C6A664" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-27" stroke="#C6A664" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="15" y2="-25" stroke="#C6A664" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="30" y2="-20" stroke="#C6A664" stroke-width="0.5"/>
  </g>
  <!-- Chevron divider -->
  <path d="M180,195 L200,205 L220,195" fill="none" stroke="#C6A664" stroke-width="0.8" opacity="0.3"/>
  <!-- Names -->
  <text x="200" y="120" text-anchor="middle" font-family="Georgia,serif" font-size="26" font-weight="200" fill="#C6A664" letter-spacing="3">AHMED</text>
  <text x="200" y="145" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#C6A664" letter-spacing="6">&amp;</text>
  <text x="200" y="175" text-anchor="middle" font-family="Georgia,serif" font-size="26" font-weight="200" fill="#C6A664" letter-spacing="3">FATIMA</text>
  <text x="200" y="240" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#C6A664" opacity="0.35">15 JUIN 2025</text>
</svg>