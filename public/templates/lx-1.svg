<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E070"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#F0C84A"/>
      <stop offset="100%" stop-color="#C6A020"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#C6A664" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="goldShimmer">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>
  <rect width="400" height="560" fill="url(#goldGlow)"/>

  <!-- Art Deco sunburst full -->
  <g transform="translate(200,0)" opacity="0.12" stroke="url(#gold)" stroke-width="0.5" fill="none">
    <line x1="0" y1="0" x2="0" y2="100"/>
    <line x1="0" y1="0" x2="50" y2="87"/>
    <line x1="0" y1="0" x2="87" y2="50"/>
    <line x1="0" y1="0" x2="100" y2="0"/>
    <line x1="0" y1="0" x2="87" y2="-50"/>
    <line x1="0" y1="0" x2="50" y2="-87"/>
    <line x1="0" y1="0" x2="-50" y2="87"/>
    <line x1="0" y1="0" x2="-87" y2="50"/>
    <line x1="0" y1="0" x2="-100" y2="0"/>
    <line x1="0" y1="0" x2="-87" y2="-50"/>
    <line x1="0" y1="0" x2="-50" y2="-87"/>
  </g>

  <!-- Multiple border frames -->
  <rect x="12" y="12" width="376" height="536" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
  <rect x="18" y="18" width="364" height="524" fill="none" stroke="#C6A664" stroke-width="0.5" opacity="0.3"/>
  <rect x="24" y="24" width="352" height="512" fill="none" stroke="#C6A664" stroke-width="0.3" opacity="0.15"/>

  <!-- Corner Art Deco brackets -->
  <g stroke="url(#gold)" stroke-width="1.2" fill="none" opacity="0.7">
    <!-- TL -->
    <path d="M12 12 L50 12"/>
    <path d="M12 12 L12 50"/>
    <path d="M20 20 L45 20"/>
    <path d="M20 20 L20 45"/>
    <!-- TR -->
    <path d="M388 12 L350 12"/>
    <path d="M388 12 L388 50"/>
    <path d="M380 20 L355 20"/>
    <path d="M380 20 L380 45"/>
    <!-- BL -->
    <path d="M12 548 L50 548"/>
    <path d="M12 548 L12 510"/>
    <path d="M20 540 L45 540"/>
    <path d="M20 540 L20 515"/>
    <!-- BR -->
    <path d="M388 548 L350 548"/>
    <path d="M388 548 L388 510"/>
    <path d="M380 540 L355 540"/>
    <path d="M380 540 L380 515"/>
  </g>

  <!-- Diamond side ornaments -->
  <g fill="url(#gold)" opacity="0.6">
    <polygon points="12,280 20,270 28,280 20,290"/>
    <polygon points="388,280 380,270 372,280 380,290"/>
  </g>

  <!-- Art Deco fan top -->
  <g transform="translate(200,80)" opacity="0.5" fill="url(#gold)">
    <!-- Large star -->
    <polygon points="0,-24 6,-7 24,-7 10,5 15,22 0,12 -15,22 -10,5 -24,-7 -6,-7"/>
  </g>

  <!-- Double gold rule -->
  <line x1="50" y1="120" x2="350" y2="120" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>
  <line x1="50" y1="124" x2="350" y2="124" stroke="#C6A664" stroke-width="0.4" opacity="0.25"/>

  <!-- Label -->
  <text x="200" y="152" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="#C6A664" opacity="0.65" letter-spacing="5">NOIR ET OR · LUXE</text>

  <!-- Monogram circle -->
  <circle cx="200" cy="200" r="38" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.4"/>
  <circle cx="200" cy="200" r="32" fill="none" stroke="#C6A664" stroke-width="0.4" opacity="0.2"/>
  <text x="200" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="url(#gold)" opacity="0.8" font-weight="300" font-style="italic">S</text>

  <!-- Names -->
  <text x="200" y="270" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="url(#gold)" font-weight="300" font-style="italic" opacity="0.9">Sonia</text>
  <text x="200" y="293" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#C6A664" opacity="0.4" letter-spacing="6">&amp;</text>
  <text x="200" y="326" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="url(#gold)" font-weight="300" font-style="italic" opacity="0.9">Selim</text>

  <!-- Art Deco chevron divider -->
  <path d="M80 348 L160 348 L200 340 L240 348 L320 348" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.45"/>

  <!-- Date -->
  <text x="200" y="378" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" fill="#C6A664" opacity="0.7" letter-spacing="2">14 · XI · 2025</text>
  <text x="200" y="400" text-anchor="middle" font-family="Georgia,serif" font-size="8.5" fill="#C6A664" opacity="0.4">Grand Palais, Carthage</text>

  <!-- Countdown dark gold boxes -->
  <g transform="translate(200,445)" opacity="0.85">
    <rect x="-110" y="-20" width="48" height="40" rx="2" fill="url(#gold)" opacity="0.12"/>
    <rect x="-55" y="-20" width="48" height="40" rx="2" fill="url(#gold)" opacity="0.12"/>
    <rect x="7" y="-20" width="48" height="40" rx="2" fill="url(#gold)" opacity="0.12"/>
    <rect x="62" y="-20" width="48" height="40" rx="2" fill="url(#gold)" opacity="0.12"/>
    <rect x="-110" y="-20" width="48" height="40" rx="2" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>
    <rect x="-55" y="-20" width="48" height="40" rx="2" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>
    <rect x="7" y="-20" width="48" height="40" rx="2" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>
    <rect x="62" y="-20" width="48" height="40" rx="2" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>
    <text x="-86" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#F0D060" opacity="0.95">55</text>
    <text x="-31" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#F0D060" opacity="0.95">22</text>
    <text x="31" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#F0D060" opacity="0.95">08</text>
    <text x="86" y="6" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#F0D060" opacity="0.95">41</text>
    <text x="-86" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#C6A664" opacity="0.45">JOURS</text>
    <text x="-31" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#C6A664" opacity="0.45">HEURES</text>
    <text x="31" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#C6A664" opacity="0.45">MIN</text>
    <text x="86" y="19" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#C6A664" opacity="0.45">SEC</text>
  </g>

  <!-- Gold RSVP bar -->
  <rect x="110" y="500" width="180" height="34" rx="2" fill="url(#gold)" opacity="0.9"/>
  <rect x="112" y="502" width="176" height="30" rx="1" fill="none" stroke="#050505" stroke-width="0.5" opacity="0.3"/>
  <text x="200" y="521" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" fill="#050505" letter-spacing="4">CONFIRMER</text>

  <!-- Tiny gold stars -->
  <g fill="url(#gold)" opacity="0.3">
    <circle cx="55" cy="160" r="1.5"/>
    <circle cx="345" cy="160" r="1.5"/>
    <circle cx="45" cy="420" r="1"/>
    <circle cx="355" cy="420" r="1"/>
  </g>

  <text x="200" y="550" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#C6A664" opacity="0.25" letter-spacing="3">DAAWA · NOIR ET OR · LUXE</text>
</svg>